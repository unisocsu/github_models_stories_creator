name: Write and polish a full-length book

on:
  workflow_dispatch:
    inputs:
      title:
        description: Book title
        required: true
        type: string
      instructions:
        description: Genre, premise, characters, setting, tone and any specific requirements
        required: true
        type: string
      language:
        description: Book language
        required: true
        default: Hebrew
        type: string
      model:
        description: GitHub Models model ID
        required: true
        default: openai/gpt-4.1
        type: string
      target_words:
        description: Approximate target length of the complete book
        required: true
        default: "50000"
        type: string
      chapter_words:
        description: Approximate words per chapter
        required: true
        default: "2200"
        type: string
      run_minutes:
        description: Active writing and editing time (the job has a 240-minute safety timeout)
        required: true
        default: "230"
        type: string

permissions:
  contents: write
  models: read

concurrency:
  group: book-writer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  write-book:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Write, revise and polish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: ${{ inputs.model }}
          BOOK_TITLE: ${{ inputs.title }}
          BOOK_INSTRUCTIONS: ${{ inputs.instructions }}
          BOOK_LANGUAGE: ${{ inputs.language }}
          BOOK_TARGET_WORDS: ${{ inputs.target_words }}
          BOOK_CHAPTER_WORDS: ${{ inputs.chapter_words }}
          BOOK_RUN_MINUTES: ${{ inputs.run_minutes }}
          BOOK_OUTPUT_DIR: books/current
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: python writer.py

      - name: Upload the latest manuscript and progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-and-progress
          path: books/
          if-no-files-found: warn
          retention-days: 30
